<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
           <div class="header">
                 <div class="search-box">
                       <input type="text" placeholder="Enter Your location" class="input-box">
                           <div class="btn-div"><button class="fa-solid fa-magnifying-glass fa-xl" ></button></div> 
                </div>
         </div> 
           
                  

              
               <div class="location-not-found">
                <h1>Sorry, Location not found!!!</h1>
                <img src="/images/404.png" alt="404 Error">
               </div>



           <div class="weather-body"> 
                   <img src="images/cloud.png" alt="Weather Image" class="weather-img" > 

                  <div class="weather-box">
                      <p class="temperature">0 <sup>°C</sup></p>
                       <p class="description">Light Rain</p>
                    </div>


                <div class="weather-details">
                    <div class="humidity">
                        <i class="fa-solid fa-droplet fa-2xl"></i>
                        <div class="text">
                            <span id="humidity">45%</span>
                            <p>humidity</p>
                        </div>
                        
                    </div>

                     
                     <div class="wind">
                        <i class="fa-solid fa-wind fa-2xl"></i>
                        <div class="text">
                            <span id="wind-speed">12Km/h</span>
                            <p>Wind Speed</p>
                        </div>
                        
                    </div>






                </div>

            </div> 
 </div>
    


   <script src="https://kit.fontawesome.com/b9333c6a34.js" crossorigin="anonymous"></script>     

</body>

 <script src="script.js" defer></script>
</html>
